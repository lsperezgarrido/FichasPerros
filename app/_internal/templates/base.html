<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fichas de perros{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="{{ url_for('index') }}">FichasPerros</a>
            <nav class="main-nav" aria-label="Navegación principal">
                <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Inicio</a>
                <a href="{{ url_for('lista_fichas') }}" {% if request.path.startswith('/fichas') %}aria-current="page"{% endif %}>Fichas</a>
                <a href="{{ url_for('index') }}#importar">Importar WhatsApp</a>
                <a href="{{ url_for('index') }}#galeria">Galería y PDF</a>
            </nav>
        </header>

        <main id="contenido" class="card">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
